<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Markify</title>

  <script src="https://code.iconify.design/3/3.1.0/iconify.min.js"></script>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/atom-one-dark.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.2/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>

  <style>
    /* Portrait Mode: Bottom Navigation Bar */
    @media (orientation: portrait) {
      .top-actions {
        top: unset !important;
        bottom: 0;
        left: 0;
            position:fixed;
        right: 0;
        height: 60px;
        backdrop-filter: blur(10px);
        justify-content: space-around;
        padding: 0 1rem;
      }

      .top-actions .flat-btn {
        flex: 1;
        height: 100%;
        border-radius: 0;
      }

      aside {
        position: fixed;
        top:unset;
        bottom: 60px; /* Offset to sit above the bottom nav bar */
        left: 0;
        right: 0;
        width: 100dvw !important;
        height: 50dvh !important;
        z-index: 190;
        background: rgba(10, 10, 10, 0.95) !important;
        backdrop-filter: blur(10px);
        padding-top: 1rem;
        margin-right: 0 !important;
        transform: translateY(0);
        border-top-left-radius: 16px;
        border-top-right-radius: 16px;
      }

      aside.collapsed {
        transform: translateY(calc(100% + 60px));
      }

      main {
        padding: 1.5rem 5% 5rem 5%;
      }
    }

    
    
    /* Strict zero borders and zero outlines globally */
    *, *:focus, *:hover, *:active {
      border: 0 !important;
      border-style: none !important;
      outline: 0 !important;
      outline-style: none !important;
      box-shadow: none !important;
    }

    :root {
      --bg-color: #000000;
      --text-muted: #888888;
      --text-main: #dddddd;
      --text-bright: #ffffff;
      --sidebar-width: 260px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
      height: 100dvh;
      overflow: hidden;
      user-select: none;
    }

    #app {
      display: flex;
      width: 100dvw;
      height: 100dvh;
      overflow: hidden;
      position: relative;
    }

    /* Top Right Control Bar */
    .top-actions {
      position: fixed;
      top: 1rem;
      right: 1rem;
      z-index: 200;
      display: flex;
      gap: 0.25rem;
      align-items: center;
    }

    .flat-btn {
      background: transparent !important;
      color: var(--text-muted);
      padding: 0.4rem;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      transition: color 0.15s ease;
    }

    .flat-btn:hover {
      color: var(--text-bright);
    }

    .flat-btn.unlocked {
      color: var(--text-bright);
    }

    /* Main Content Area */
    main {
      flex: 1;
      height: 100dvh;
      overflow-y: auto;
      padding: 3.5rem 12% 5rem 10%;
      position: relative;
      user-select: text;
    }

    /* Drag Drop Overlay Target */
    #drop-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.9);
      z-index: 300;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 1rem;
      color: var(--text-bright);
      pointer-events: none;
    }

    #drop-overlay.active {
      display: flex;
    }

    /* Right Side Sidebar (Default Landscape) */
    aside {
      width: var(--sidebar-width);
      height: 100dvh;
      background: transparent !important;
      display: flex;
      flex-direction: column;
      order: 2;
      transition: margin-right 0.2s ease, transform 0.2s ease;
      user-select: none;
      padding-top: 3.5rem;
    }

    aside.collapsed {
      margin-right: calc(var(--sidebar-width) * -1);
    }


    /* Flat Sidebar Actions Bar */
    .sidebar-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 1.25rem 0.75rem 1.25rem;
    }

    .sidebar-title {
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--text-muted);
      letter-spacing: 0.05em;
    }

    .action-icons {
      display: flex;
      gap: 0.2rem;
    }

    /* Flat Document List */
    #file-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.1rem;
      overflow-y: auto;
      flex: 1;
      padding: 0 0.75rem;
    }

    #file-list li {
      padding: 0.4rem 0.5rem;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.9rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--text-muted);
      transition: color 0.15s ease;
      background: transparent !important;
    }

    #file-list li:hover {
      color: var(--text-bright);
    }

    #file-list li.active {
      color: var(--text-bright);
      font-weight: 500;
    }

    #file-list .file-item-name {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #file-list .delete-btn {
      color: var(--text-muted);
      opacity: 0;
      background: transparent !important;
      cursor: pointer;
      display: flex;
      align-items: center;
      padding: 0.1rem;
      transition: opacity 0.15s, color 0.15s;
    }

    #file-list li:hover .delete-btn {
      opacity: 1;
    }

    #file-list .delete-btn:hover {
      color: var(--text-bright);
    }

    /* Bottom Sidebar Footer Info */
    .sidebar-footer {
      padding: 1.25rem;
      font-size: 0.75rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Content Area Typography & Clean Flat Rendering */
    #content {
      line-height: 1.7;
      font-size: 1.05rem;
      min-height: 80vh;
      background: transparent !important;
    }

    #content.editable-mode {
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace;
      font-size: 0.95rem;
      white-space: pre-wrap;
      word-break: break-word;
      color: var(--text-bright);
      padding: 0;
    }

    #content h1 {
      color: var(--text-bright);
      font-size: 2.2rem;
      font-weight: 700;
      margin: 0 0 1.2rem 0;
      letter-spacing: -0.02em;
    }

    #content h2 {
      color: var(--text-bright);
      font-size: 1.5rem;
      font-weight: 600;
      margin: 1.8em 0 0.6em 0;
    }

    #content h3, #content h4 {
      color: var(--text-bright);
      margin: 1.5em 0 0.5em 0;
      font-weight: 600;
    }

    #content p {
      margin-bottom: 1.2em;
    }

    #content a {
      color: var(--text-bright);
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    #content ul, #content ol {
      margin: 1em 0;
      padding-left: 1.5em;
    }

    #content li {
      margin-bottom: 0.4em;
    }

    #content blockquote {
      padding-left: 1em;
      color: var(--text-muted);
      margin: 1.2em 0;
    }

    #content pre {
      background: transparent !important;
      padding: 1em 0 !important;
      margin: 1.5em 0 !important;
      overflow-x: auto;
    }

    #content code {
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace;
      font-size: 0.9em;
    }

    #content :not(pre) > code {
      color: var(--text-bright);
    }

    .hidden-input {
      display: none;
    }

    /* Custom Flat Modals (Replacing browser alert/confirm/prompt) */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      z-index: 500;
      align-items: center;
      justify-content: center;
    }

    .modal-backdrop.active {
      display: flex;
    }

    .modal-box {
      background: var(--bg-color);
      padding: 1.5rem 2rem;
      border-radius: 6px;
      max-width: 400px;
      width: 90%;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .modal-text {
      color: var(--text-bright);
      font-size: 0.95rem;
      line-height: 1.5;
    }

    .modal-input {
      background: transparent;
      color: var(--text-bright);
      font-size: 0.95rem;
      padding: 0.4rem 0;
      width: 100%;
    }

    .modal-buttons {
      display: flex;
      justify-content: flex-end;
      gap: 0.75rem;
      margin-top: 0.5rem;
    }

    .modal-btn {
      background: transparent;
      color: var(--text-muted);
      font-size: 0.85rem;
      cursor: pointer;
      padding: 0.3rem 0.6rem;
      transition: color 0.15s ease;
    }

    .modal-btn:hover {
      color: var(--text-bright);
    }

    ::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.25);
    }
  </style>
</head>
<body>

  <div id="app">
    <div class="top-actions">
      <button class="flat-btn" id="lock-btn" onclick="toggleLock()" aria-label="Toggle Edit" title="Lock/Unlock Editing">
        <span class="iconify" id="lock-icon" data-icon="lucide:lock" data-width="18"></span>
      </button>
      <button class="flat-btn" onclick="toggleFullScreen()" aria-label="Toggle Fullscreen" title="Toggle Fullscreen">
        <span class="iconify" id="fullscreen-icon" data-icon="lucide:maximize" data-width="18"></span>
      </button>
      <button class="flat-btn" onclick="toggleSidebar()" aria-label="Toggle Sidebar" title="Toggle Sidebar">
        <span class="iconify" data-icon="lucide:panel-right" data-width="18"></span>
      </button>
    </div>

    <main id="main-container">
      <div id="content" contenteditable="false" oninput="handleRealtimeInput()"></div>
    </main>

    <div id="drop-overlay">
      <span class="iconify" data-icon="lucide:upload-cloud" data-width="48"></span>
      <p>Drop Markdown file here to load</p>
    </div>

    <aside id="sidebar">
      <div class="sidebar-actions">
        <span class="sidebar-title">MARKIFY</span>
        <div class="action-icons">
          <button class="flat-btn" title="Create New File" onclick="createNewFile()">
            <span class="iconify" data-icon="lucide:file-plus" data-width="16"></span>
          </button>
          <button class="flat-btn" title="Upload Markdown File" onclick="triggerFileInput()">
            <span class="iconify" data-icon="lucide:upload" data-width="16"></span>
          </button>
          <button class="flat-btn" title="Fetch MD from URL" onclick="promptUrlUpload()">
            <span class="iconify" data-icon="lucide:link" data-width="16"></span>
          </button>
        </div>
      </div>

      <ul id="file-list"></ul>

      <div class="sidebar-footer">
        <span id="stat-words">0 words</span>
        <span id="stat-chars">0 characters</span>
      </div>
    </aside>

    <input type="file" id="file-upload" class="hidden-input" accept=".md,.markdown,.txt" multiple onchange="handleFileUpload(event)" />
  </div>

  <div class="modal-backdrop" id="custom-modal">
    <div class="modal-box">
      <div class="modal-text" id="modal-msg"></div>
      <input type="text" class="modal-input" id="modal-input-field" style="display: none;" />
      <div class="modal-buttons">
        <button class="modal-btn" id="modal-cancel-btn" style="display: none;">Cancel</button>
        <button class="modal-btn" id="modal-ok-btn">OK</button>
      </div>
    </div>
  </div>

  <script>
    marked.setOptions({
      highlight: function(code, lang) {
        const language = hljs.getLanguage(lang) ? lang : 'plaintext';
        return hljs.highlight(code, { language }).value;
      },
      langPrefix: 'hljs language-'
    });

    let documents = JSON.parse(localStorage.getItem('markify_docs') || '{}');
    let currentDocKey = localStorage.getItem('markify_current_doc') || null;
    let isUnlocked = false;

    // Load initial layout and documents state from LocalStorage
    window.addEventListener('DOMContentLoaded', () => {
      // 1. Sidebar state persistence
      const isSidebarCollapsed = localStorage.getItem('markify_sidebar_collapsed') === 'true';
      if (isSidebarCollapsed) {
        document.getElementById('sidebar').classList.add('collapsed');
      }

      // 2. Default documents if empty
      if (Object.keys(documents).length === 0) {
        documents["01_Genesis"] = "# Genesis\n\n## Chapter 1\n\n1. In the beginning, God created the heavens and the earth.\n2. The earth was without form and void, and darkness was over the face of the deep.";
        documents["02_Exodus"] = "# Exodus\n\n## Chapter 1\n\n1. These are the names of the sons of Israel who came to Egypt with Jacob.";
        saveDocuments();
      }

      renderFileList();
      
      const keys = Object.keys(documents);
      if (keys.length > 0) {
        if (currentDocKey && documents[currentDocKey]) {
          loadDocument(currentDocKey);
        } else {
          loadDocument(keys[0]);
        }
      }
    });

    function saveDocuments() {
      localStorage.setItem('markify_docs', JSON.stringify(documents));
    }

    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      sidebar.classList.toggle('collapsed');
      const isCollapsed = sidebar.classList.contains('collapsed');
      localStorage.setItem('markify_sidebar_collapsed', isCollapsed);
    }

    function toggleFullScreen() {
      const fsIcon = document.getElementById('fullscreen-icon');
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
        fsIcon.setAttribute('data-icon', 'lucide:minimize');
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
          fsIcon.setAttribute('data-icon', 'lucide:maximize');
        }
      }
    }

    function toggleLock() {
      if (!currentDocKey) return;
      isUnlocked = !isUnlocked;
      
      const content = document.getElementById('content');
      const lockBtn = document.getElementById('lock-btn');
      const lockIcon = document.getElementById('lock-icon');

      if (isUnlocked) {
        content.contentEditable = "true";
        content.classList.add('editable-mode');
        content.innerText = documents[currentDocKey] || '';
        
        lockBtn.classList.add('unlocked');
        lockIcon.setAttribute('data-icon', 'lucide:lock-keyhole-open');
      } else {
        content.contentEditable = "false";
        content.classList.remove('editable-mode');
        renderMarkdown(documents[currentDocKey] || '');
        
        lockBtn.classList.remove('unlocked');
        lockIcon.setAttribute('data-icon', 'lucide:lock');
      }
    }

    function handleRealtimeInput() {
      if (!isUnlocked || !currentDocKey) return;
      const content = document.getElementById('content');
      documents[currentDocKey] = content.innerText;
      saveDocuments();
      updateStats(content.innerText);
    }

    // Force Paste as Plain Text only to eliminate hidden HTML/CSS tags
    document.getElementById('content').addEventListener('paste', function(e) {
      if (!isUnlocked) return;
      e.preventDefault();
      const text = e.clipboardData.getData('text/plain');
      document.execCommand('insertText', false, text);
    });

    // Global Paste Listener: Paste a valid URL anywhere to fetch MD directly
    window.addEventListener('paste', function(e) {
      if (isUnlocked) return;
      const pastedData = e.clipboardData.getData('text');
      if (isValidUrl(pastedData.trim())) {
        e.preventDefault();
        fetchMdFromUrl(pastedData.trim());
      }
    });

    function isValidUrl(string) {
      try {
        const url = new URL(string);
        return url.protocol === "http:" || url.protocol === "https:";
      } catch (_) {
        return false;  
      }
    }

    function renderMarkdown(text) {
      document.getElementById('content').innerHTML = marked.parse(text);
      updateStats(text);
    }

    function loadDocument(name) {
      currentDocKey = name;
      localStorage.setItem('markify_current_doc', name);
      
      const contentEl = document.getElementById('content');
      if (isUnlocked) {
        contentEl.innerText = documents[name] || '';
      } else {
        renderMarkdown(documents[name] || '');
      }
      updateStats(documents[name] || '');
      renderFileList();
    }

    async function createNewFile() {
      const fileName = await customPrompt("Enter new file name:", "Untitled.md");
      if (!fileName) return;
      const cleanName = fileName.endsWith('.md') ? fileName.slice(0, -3) : fileName;
      documents[cleanName] = `# ${cleanName}\n\nStart writing...`;
      saveDocuments();
      loadDocument(cleanName);
    }

    async function deleteDocument(e, name) {
      e.stopPropagation();
      const confirmed = await customConfirm(`Delete document "${name}"?`);
      if (!confirmed) return;

      delete documents[name];
      saveDocuments();
      
      if (currentDocKey === name) {
        const remainingKeys = Object.keys(documents);
        if (remainingKeys.length > 0) {
          loadDocument(remainingKeys[0]);
        } else {
          currentDocKey = null;
          localStorage.removeItem('markify_current_doc');
          document.getElementById('content').innerHTML = '';
          updateStats('');
        }
      }
      renderFileList();
    }

    function renderFileList() {
      const list = document.getElementById('file-list');
      list.innerHTML = '';
      
      Object.keys(documents).forEach(name => {
        const li = document.createElement('li');
        li.className = name === currentDocKey ? 'active' : '';
        li.onclick = () => loadDocument(name);
        
        const nameWrapper = document.createElement('div');
        nameWrapper.className = 'file-item-name';
        nameWrapper.innerHTML = `<span>${escapeHtml(name)}</span>`;

        const delBtn = document.createElement('button');
        delBtn.className = 'delete-btn';
        delBtn.innerHTML = `<span class="iconify" data-icon="lucide:x" data-width="14"></span>`;
        delBtn.onclick = (e) => deleteDocument(e, name);

        li.appendChild(nameWrapper);
        li.appendChild(delBtn);
        list.appendChild(li);
      });
    }

    function triggerFileInput() {
      document.getElementById('file-upload').click();
    }

    function handleFileUpload(event) {
      const files = Array.from(event.target.files);
      if (!files.length) return;

      let readCount = 0;
      files.forEach(file => {
        const reader = new FileReader();
        reader.onload = function(e) {
          const nameWithoutExt = file.name.replace(/\.[^/.]+$/, "");
          documents[nameWithoutExt] = e.target.result;
          readCount++;
          if (readCount === files.length) {
            saveDocuments();
            renderFileList();
            loadDocument(nameWithoutExt);
          }
        };
        reader.readAsText(file);
      });
      event.target.value = '';
    }

    async function promptUrlUpload() {
      const url = await customPrompt("Paste Markdown file URL:");
      if (url && isValidUrl(url.trim())) {
        fetchMdFromUrl(url.trim());
      }
    }

    async function fetchMdFromUrl(url) {
      try {
        const response = await fetch(url);
        if (!response.ok) throw new Error("Network error");
        const text = await response.text();
        const fileName = url.split('/').pop().split('?')[0].replace(/\.[^/.]+$/, "") || `Remote_${Date.now()}`;
        documents[fileName] = text;
        saveDocuments();
        renderFileList();
        loadDocument(fileName);
      } catch (err) {
        customAlert("Failed to fetch Markdown from URL. Check CORS or URL validity.");
      }
    }

    // Drag & Drop Functionality
    const dropOverlay = document.getElementById('drop-overlay');

    window.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropOverlay.classList.add('active');
    });

    window.addEventListener('dragleave', (e) => {
      if (e.clientX === 0 && e.clientY === 0) {
        dropOverlay.classList.remove('active');
      }
    });

    window.addEventListener('drop', (e) => {
      e.preventDefault();
      dropOverlay.classList.remove('active');
      const files = e.dataTransfer.files;
      if (files.length > 0) {
        handleFileUpload({ target: { files: files } });
      }
    });

    function updateStats(text) {
      const words = text.trim() ? text.trim().split(/\s+/).length : 0;
      const chars = text.length;
      document.getElementById('stat-words').innerText = `${words.toLocaleString()} words`;
      document.getElementById('stat-chars').innerText = `${chars.toLocaleString()} characters`;
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    /* Custom HTML Modals Implementation (Replacing Native Dialogs) */
    function customAlert(message) {
      return new Promise((resolve) => {
        const modal = document.getElementById('custom-modal');
        const msg = document.getElementById('modal-msg');
        const input = document.getElementById('modal-input-field');
        const cancelBtn = document.getElementById('modal-cancel-btn');
        const okBtn = document.getElementById('modal-ok-btn');

        msg.innerText = message;
        input.style.display = 'none';
        cancelBtn.style.display = 'none';
        modal.classList.add('active');

        okBtn.onclick = () => {
          modal.classList.remove('active');
          resolve();
        };
      });
    }

    function customConfirm(message) {
      return new Promise((resolve) => {
        const modal = document.getElementById('custom-modal');
        const msg = document.getElementById('modal-msg');
        const input = document.getElementById('modal-input-field');
        const cancelBtn = document.getElementById('modal-cancel-btn');
        const okBtn = document.getElementById('modal-ok-btn');

        msg.innerText = message;
        input.style.display = 'none';
        cancelBtn.style.display = 'block';
        modal.classList.add('active');

        okBtn.onclick = () => {
          modal.classList.remove('active');
          resolve(true);
        };

        cancelBtn.onclick = () => {
          modal.classList.remove('active');
          resolve(false);
        };
      });
    }

    function customPrompt(message, defaultValue = '') {
      return new Promise((resolve) => {
        const modal = document.getElementById('custom-modal');
        const msg = document.getElementById('modal-msg');
        const input = document.getElementById('modal-input-field');
        const cancelBtn = document.getElementById('modal-cancel-btn');
        const okBtn = document.getElementById('modal-ok-btn');

        msg.innerText = message;
        input.value = defaultValue;
        input.style.display = 'block';
        cancelBtn.style.display = 'block';
        modal.classList.add('active');
        input.focus();

        okBtn.onclick = () => {
          const val = input.value;
          modal.classList.remove('active');
          resolve(val);
        };

        cancelBtn.onclick = () => {
          modal.classList.remove('active');
          resolve(null);
        };
      });
    }
  </script>
</body>
</html>
