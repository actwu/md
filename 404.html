<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reader</title>

  <!-- Iconify CDN for Lucide Icons -->
  <script src="https://code.iconify.design/3/3.1.0/iconify.min.js"></script>

  <!-- Highlight.js (Atom One Dark Theme) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/atom-one-dark.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.2/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>

  <style>
    *, *:focus, *:hover, *:active {
      border: none !important;
      outline: none !important;
    }

    :root {
      --bg-color: #0a0a0c;
      --sidebar-bg: #0a0a0c;
      --hover-bg: rgba(250, 250, 255, 0.08);
      --active-bg: rgba(250, 250, 255, 0.15);
      --accent-20: rgba(250, 250, 255, 0.2);
      --text-muted: #71717a;
      --text-main: #fafaff;
      --text-bright: #ffffff;
      --sidebar-width: 300px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
      height: 100vh;
      overflow: hidden;
    }

    #app {
      display: flex;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* Fixed Actions Container for Sidebar Toggle and Lock/Unlock Toggle */
    .top-actions {
      position: fixed;
      top: 0.85rem;
      right: 1rem;
      z-index: 100;
      display: flex;
      gap: 0.5rem;
    }

    .pill-btn {
      background: rgba(250, 250, 255, 0.05);
      color: var(--text-muted);
      border: 0 !important;
      outline: 0 !important;
      padding: 0.45rem 0.85rem;
      border-radius: 9999px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
      font-size: 0.8rem;
      transition: background 0.2s, color 0.2s;
    }

    .pill-btn:hover {
      color: var(--text-bright);
      background: var(--hover-bg);
    }

    .pill-btn.unlocked {
      background: rgba(250, 250, 255, 0.2);
      color: var(--text-bright);
    }

    /* Main Content Area */
    main {
      flex: 1;
      height: 100%;
      overflow-y: auto;
      padding: 3rem 12% 5rem 12%;
      position: relative;
    }

    /* Loader */
    #loader {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: var(--text-bright);
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }

    /* Sidebar */
    aside {
      width: var(--sidebar-width);
      height: 100%;
      background-color: var(--sidebar-bg);
      display: flex;
      flex-direction: column;
      transition: margin-right 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    aside.collapsed {
      margin-right: calc(var(--sidebar-width) * -1);
    }

    .sidebar-header-spacer {
      height: 3.2rem;
      flex-shrink: 0;
    }

    .sidebar-tabs {
      display: flex;
      border-bottom: 1px solid rgba(250, 250, 255, 0.08);
      padding: 0 0.5rem;
    }

    .tab-btn {
      flex: 1;
      background: transparent;
      border: none !important;
      outline: none !important;
      color: var(--text-muted);
      padding: 0.6rem 0.4rem;
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      border-radius: 4px 4px 0 0;
      transition: color 0.2s, background 0.2s;
    }

    .tab-btn:hover {
      color: var(--text-bright);
      background: var(--hover-bg);
    }

    .tab-btn.active {
      color: var(--text-bright);
      border-bottom: 2px solid var(--text-bright) !important;
    }

    .sidebar-body {
      padding: 1rem;
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .tab-content {
      display: none;
      flex-direction: column;
      gap: 1rem;
      height: 100%;
    }

    .tab-content.active {
      display: flex;
    }

    .sidebar-title {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .action-icons {
      display: flex;
      gap: 0.25rem;
    }

    .icon-btn {
      background: transparent;
      border: none !important;
      outline: none !important;
      color: var(--text-muted);
      padding: 0.25rem;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.2s, background 0.2s;
    }

    .icon-btn:hover {
      color: var(--text-bright);
      background: var(--hover-bg);
    }

    .btn-transparent {
      background: var(--accent-20);
      color: var(--text-bright);
      border: 0 !important;
      outline: 0 !important;
      padding: 0.6rem 0.8rem;
      border-radius: 9999px;
      cursor: pointer;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      width: 100%;
      transition: background 0.2s;
      text-align: center;
    }

    .btn-transparent:hover {
      background: rgba(250, 250, 255, 0.3);
    }

    .file-input-wrapper input[type="file"] {
      display: none;
    }

    textarea.transparent-input {
      width: 100%;
      height: 100px;
      background: rgba(250, 250, 255, 0.05);
      color: var(--text-bright);
      border: 0 !important;
      outline: none !important;
      font-size: 0.8rem;
      font-family: inherit;
      resize: none;
      padding: 0.75rem;
      border-radius: 8px;
      transition: background 0.2s;
    }

    textarea.transparent-input:focus {
      background: rgba(250, 250, 255, 0.08);
    }

    #file-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      overflow-y: auto;
      flex: 1;
    }

    #file-list li {
      padding: 0.5rem 0.6rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--text-muted);
      transition: background 0.2s, color 0.2s;
    }

    #file-list li:hover {
      background: var(--hover-bg);
      color: var(--text-bright);
    }

    #file-list li.active {
      color: var(--text-bright);
      background: var(--active-bg);
      font-weight: 500;
    }

    #file-list .file-item-name {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #file-list .delete-btn {
      color: var(--text-muted);
      opacity: 0;
      background: transparent;
      border: none !important;
      outline: none !important;
      cursor: pointer;
      display: flex;
      align-items: center;
      padding: 0.2rem;
      border-radius: 3px;
      transition: opacity 0.2s, color 0.2s;
    }

    #file-list li:hover .delete-btn {
      opacity: 1;
    }

    #file-list .delete-btn:hover {
      color: var(--text-bright);
      background: var(--hover-bg);
    }

    /* Content Area Styles */
    #content {
      line-height: 1.7;
      font-size: 1.05rem;
      min-height: 80vh;
      white-space: normal;
    }

    /* Plain text editor style when unlocked */
    #content.editable-mode {
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace;
      font-size: 0.95rem;
      white-space: pre-wrap;
      word-break: break-word;
      color: var(--text-bright);
      background: rgba(250, 250, 255, 0.02);
      padding: 1rem;
      border-radius: 8px;
    }

    #content h1, #content h2, #content h3, #content h4 {
      color: var(--text-bright);
      margin: 1.8em 0 0.6em 0;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    #content p {
      margin-bottom: 1.2em;
    }

    #content a {
      color: var(--text-bright);
      background-color: var(--accent-20);
      padding: 0.15em 0.4em;
      border-radius: 3px;
      text-decoration: none;
      transition: background-color 0.2s;
    }

    #content a:hover {
      background-color: rgba(250, 250, 255, 0.35);
      text-decoration: none;
    }

    #content ul, #content ol {
      margin: 1em 0;
      padding-left: 1.5em;
    }

    #content li {
      margin-bottom: 0.4em;
    }

    #content blockquote {
      padding: 0.5em 1em;
      color: var(--text-main);
      background: var(--accent-20);
      margin: 1.2em 0;
      border-left: 3px solid var(--text-bright);
      border-radius: 0 4px 4px 0;
    }

    #content pre {
      background: rgba(250, 250, 255, 0.03) !important;
      padding: 1.2em !important;
      margin: 1.5em 0 !important;
      border-radius: 6px;
      overflow-x: auto;
    }

    #content code {
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace;
      font-size: 0.9em;
    }

    #content :not(pre) > code {
      background: var(--accent-20);
      padding: 0.2em 0.4em;
      border-radius: 3px;
      color: var(--text-bright);
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(250, 250, 255, 0.1);
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(250, 250, 255, 0.2);
    }
  </style>
</head>
<body>

  <div id="app">
    <!-- Top Action Buttons -->
    <div class="top-actions">
      <button class="pill-btn" id="lock-btn" onclick="toggleLock()" aria-label="Toggle Edit Lock" title="Lock/Unlock Editing">
        <span class="iconify" id="lock-icon" data-icon="lucide:lock" data-width="16"></span>
        <span id="lock-text">Locked</span>
      </button>
      <button class="pill-btn" onclick="toggleSidebar()" aria-label="Toggle Sidebar" title="Toggle Sidebar">
        <span class="iconify" data-icon="lucide:panel-right" data-width="16"></span>
      </button>
    </div>

    <!-- Document View -->
    <main>
      <div id="loader">
        <span class="iconify" data-icon="lucide:loader-2" data-width="28"></span>
      </div>
      <div id="content" contenteditable="false" oninput="handleRealtimeInput()"></div>
    </main>

    <!-- Sidebar -->
    <aside id="sidebar">
      <div class="sidebar-header-spacer"></div>

      <!-- Tabs Navigation -->
      <div class="sidebar-tabs">
        <button class="tab-btn active" id="tab-btn-1" onclick="switchTab(1)">
          <span class="iconify" data-icon="lucide:files" data-width="14"></span>
          Docs
        </button>
        <button class="tab-btn" id="tab-btn-2" onclick="switchTab(2)">
          <span class="iconify" data-icon="lucide:upload-cloud" data-width="14"></span>
          Upload
        </button>
        <button class="tab-btn" id="tab-btn-3" onclick="switchTab(3)">
          <span class="iconify" data-icon="lucide:link" data-width="14"></span>
          URL
        </button>
      </div>

      <!-- Tab Contents -->
      <div class="sidebar-body">
        <!-- Tab 1: Documents List -->
        <div class="tab-content active" id="tab-1">
          <div class="sidebar-title">
            <span>Documents</span>
            <div class="action-icons">
              <button class="icon-btn" title="Upload File" onclick="switchTab(2)">
                <span class="iconify" data-icon="lucide:upload-cloud" data-width="14"></span>
              </button>
              <button class="icon-btn" title="Add URL" onclick="switchTab(3)">
                <span class="iconify" data-icon="lucide:link" data-width="14"></span>
              </button>
            </div>
          </div>
          <ul id="file-list"></ul>
        </div>

        <!-- Tab 2: Upload Files -->
        <div class="tab-content" id="tab-2">
          <span class="sidebar-title">Upload Markdown</span>
          <div class="file-input-wrapper">
            <label class="btn-transparent" for="file-upload">
              <span class="iconify" data-icon="lucide:file-plus" data-width="16"></span>
              Choose Files...
            </label>
            <input type="file" id="file-upload" accept=".md,.markdown,.txt" multiple onchange="handleFileUpload(event)" />
          </div>
        </div>

        <!-- Tab 3: Bulk URLs -->
        <div class="tab-content" id="tab-3">
          <span class="sidebar-title">Fetch from URL</span>
          <textarea id="url-input" class="transparent-input" placeholder="Paste .md URLs (1 per line)..."></textarea>
          <button class="btn-transparent" onclick="handleBulkUrls()">
            <span class="iconify" data-icon="lucide:download" data-width="16"></span>
            Fetch URLs
          </button>
        </div>
      </div>
    </aside>
  </div>

  <script>
    marked.setOptions({
      highlight: function(code, lang) {
        const language = hljs.getLanguage(lang) ? lang : 'plaintext';
        return hljs.highlight(code, { language }).value;
      },
      langPrefix: 'hljs language-'
    });

    let documents = JSON.parse(localStorage.getItem('md_docs') || '{}');
    let currentDocKey = null;
    let isUnlocked = false;

    window.addEventListener('DOMContentLoaded', () => {
      renderFileList();
      const keys = Object.keys(documents);
      if (keys.length > 0) {
        loadDocument(keys[0]);
      }
    });

    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      sidebar.classList.toggle('collapsed');
    }

    function switchTab(tabIndex) {
      document.querySelectorAll('.tab-btn').forEach((btn, idx) => {
        btn.classList.toggle('active', idx + 1 === tabIndex);
      });
      document.querySelectorAll('.tab-content').forEach((content, idx) => {
        content.classList.toggle('active', idx + 1 === tabIndex);
      });
    }

    function showLoader() {
      document.getElementById('loader').style.display = 'block';
      document.getElementById('content').style.opacity = '0.2';
    }

    function hideLoader() {
      document.getElementById('loader').style.display = 'none';
      document.getElementById('content').style.opacity = '1';
    }

    /* Lock/Unlock Functionality */
    function toggleLock() {
      if (!currentDocKey) return;
      isUnlocked = !isUnlocked;
      
      const content = document.getElementById('content');
      const lockBtn = document.getElementById('lock-btn');
      const lockIcon = document.getElementById('lock-icon');
      const lockText = document.getElementById('lock-text');

      if (isUnlocked) {
        // Unlock mode: Show raw markdown as plain text
        content.contentEditable = "true";
        content.classList.add('editable-mode');
        content.innerText = documents[currentDocKey] || '';
        
        lockBtn.classList.add('unlocked');
        lockIcon.setAttribute('data-icon', 'lucide:lock-keyhole-open');
        lockText.innerText = 'Unlocked';
      } else {
        // Lock mode: Render raw text into formatted Markdown
        content.contentEditable = "false";
        content.classList.remove('editable-mode');
        renderMarkdown(documents[currentDocKey] || '');
        
        lockBtn.classList.remove('unlocked');
        lockIcon.setAttribute('data-icon', 'lucide:lock');
        lockText.innerText = 'Locked';
      }
    }

    /* Real-Time Editable Input Handler */
    function handleRealtimeInput() {
      if (!isUnlocked || !currentDocKey) return;
      const content = document.getElementById('content');
      
      // Store plain text directly (stripping HTML execution)
      documents[currentDocKey] = content.innerText;
      localStorage.setItem('md_docs', JSON.stringify(documents));
    }

    /* Paste Event Handler to prevent pasting formatted HTML */
    document.getElementById('content').addEventListener('paste', function(e) {
      if (!isUnlocked) return;
      e.preventDefault();
      const text = e.clipboardData.getData('text/plain');
      document.execCommand('insertText', false, text);
    });

    function renderMarkdown(text) {
      document.getElementById('content').innerHTML = marked.parse(text);
    }

    function loadDocument(name) {
      currentDocKey = name;
      const contentEl = document.getElementById('content');
      
      if (isUnlocked) {
        contentEl.innerText = documents[name] || '';
      } else {
        renderMarkdown(documents[name] || '');
      }
      
      renderFileList();
    }

    function deleteDocument(e, name) {
      e.stopPropagation();
      delete documents[name];
      localStorage.setItem('md_docs', JSON.stringify(documents));
      
      if (currentDocKey === name) {
        const remainingKeys = Object.keys(documents);
        if (remainingKeys.length > 0) {
          loadDocument(remainingKeys[0]);
        } else {
          currentDocKey = null;
          document.getElementById('content').innerHTML = '';
        }
      }
      renderFileList();
    }

    function renderFileList() {
      const list = document.getElementById('file-list');
      list.innerHTML = '';
      
      Object.keys(documents).forEach(name => {
        const li = document.createElement('li');
        li.className = name === currentDocKey ? 'active' : '';
        li.onclick = () => loadDocument(name);
        
        const nameWrapper = document.createElement('div');
        nameWrapper.className = 'file-item-name';
        nameWrapper.innerHTML = `<span class="iconify" data-icon="lucide:file-text" data-width="14"></span> <span>${escapeHtml(name)}</span>`;

        const delBtn = document.createElement('button');
        delBtn.className = 'delete-btn';
        delBtn.innerHTML = `<span class="iconify" data-icon="lucide:x" data-width="14"></span>`;
        delBtn.onclick = (e) => deleteDocument(e, name);

        li.appendChild(nameWrapper);
        li.appendChild(delBtn);
        list.appendChild(li);
      });
    }

    function handleFileUpload(event) {
      const files = Array.from(event.target.files);
      if (!files.length) return;

      showLoader();
      let readCount = 0;

      files.forEach(file => {
        const reader = new FileReader();
        reader.onload = function(e) {
          documents[file.name] = e.target.result;
          readCount++;
          if (readCount === files.length) {
            localStorage.setItem('md_docs', JSON.stringify(documents));
            hideLoader();
            renderFileList();
            loadDocument(files[files.length - 1].name);
            switchTab(1);
          }
        };
        reader.readAsText(file);
      });

      event.target.value = '';
    }

    async function handleBulkUrls() {
      const textarea = document.getElementById('url-input');
      const urls = textarea.value.split('\n').map(u => u.trim()).filter(u => u.length > 0);
      if (!urls.length) return;

      showLoader();

      for (const url of urls) {
        try {
          const response = await fetch(url);
          if (!response.ok) continue;
          const text = await response.text();
          const fileName = url.split('/').pop().split('?')[0] || `Remote-${Date.now()}.md`;
          documents[fileName] = text;
        } catch (err) {
          console.error(`Failed to fetch: ${url}`);
        }
      }

      localStorage.setItem('md_docs', JSON.stringify(documents));
      hideLoader();
      textarea.value = '';
      renderFileList();
      
      const keys = Object.keys(documents);
      if (keys.length > 0) {
        loadDocument(keys[keys.length - 1]);
      }
      switchTab(1);
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
  </script>
</body>
</html>
