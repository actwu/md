<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Markdown Reader</title>
  
  <!-- Highlight.js CSS (Atom One Dark Theme) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/atom-one-dark.min.css" />
  <!-- Marked parser and Highlight.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.2/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>

  <style>
    :root {
      --bg-color: #0a0a0c;
      --sidebar-bg: #121216;
      --hover-bg: #1d1d24;
      --text-color: #e1e1e6;
      --muted-text: #888893;
      --accent-color: #3b82f6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Main Container */
    #app {
      display: flex;
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    /* Main Content Area */
    main {
      flex: 1;
      height: 100%;
      overflow-y: auto;
      padding: 3rem 15% 5rem 15%;
      position: relative;
    }

    /* Loader (No text) */
    #loader {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 36px;
      height: 36px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      border-top-color: var(--accent-color);
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }

    /* Floating Sidebar Toggle Button */
    #toggle-btn {
      position: fixed;
      top: 1.5rem;
      right: 1.5rem;
      background: var(--sidebar-bg);
      color: var(--text-color);
      border: none;
      outline: none;
      padding: 0.6rem 0.9rem;
      border-radius: 6px;
      cursor: pointer;
      z-index: 100;
      font-size: 0.9rem;
      transition: background 0.2s;
    }

    #toggle-btn:hover {
      background: var(--hover-bg);
    }

    /* Right Sidebar */
    aside {
      width: 320px;
      height: 100%;
      background-color: var(--sidebar-bg);
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      padding: 1.5rem;
      position: fixed;
      right: -320px;
      top: 0;
      transition: right 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 90;
    }

    aside.open {
      right: 0;
    }

    .sidebar-section {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .sidebar-section h3 {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted-text);
    }

    input[type="text"] {
      width: 100%;
      padding: 0.6rem 0.8rem;
      background: var(--bg-color);
      border: none;
      border-radius: 4px;
      color: var(--text-color);
      outline: none;
      font-size: 0.85rem;
    }

    .file-input-wrapper {
      position: relative;
    }

    .file-input-wrapper input[type="file"] {
      display: none;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 0.6rem;
      background: var(--bg-color);
      color: var(--text-color);
      border: none;
      border-radius: 4px;
      text-align: center;
      cursor: pointer;
      font-size: 0.85rem;
      transition: background 0.2s;
    }

    .btn:hover {
      background: var(--hover-bg);
    }

    /* File List */
    #file-list {
      list-style: none;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    #file-list li {
      padding: 0.6rem 0.8rem;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--muted-text);
      transition: background 0.2s, color 0.2s;
    }

    #file-list li:hover {
      background: var(--hover-bg);
      color: var(--text-color);
    }

    #file-list li.active {
      color: var(--accent-color);
      background: var(--hover-bg);
    }

    #file-list .delete-btn {
      color: var(--muted-text);
      opacity: 0;
      transition: opacity 0.2s;
    }

    #file-list li:hover .delete-btn {
      opacity: 1;
    }

    #file-list .delete-btn:hover {
      color: #ef4444;
    }

    /* Markdown Output Styles */
    #content {
      line-height: 1.7;
      font-size: 1rem;
    }

    #content h1, #content h2, #content h3, #content h4 {
      color: #fff;
      margin: 1.5em 0 0.5em 0;
      font-weight: 600;
    }

    #content p {
      margin-bottom: 1em;
      color: #d1d5db;
    }

    #content a {
      color: var(--accent-color);
      text-decoration: none;
    }

    #content ul, #content ol {
      margin: 1em 0;
      padding-left: 1.5em;
    }

    #content blockquote {
      padding-left: 1em;
      color: var(--muted-text);
      margin: 1em 0;
    }

    /* Borderless Code blocks */
    #content pre {
      background: transparent !important;
      padding: 1em 0 !important;
      margin: 1em 0 !important;
      border: none !important;
      border-radius: 0 !important;
      overflow-x: auto;
    }

    #content code {
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace;
      font-size: 0.9em;
      border: none !important;
    }

    #content :not(pre) > code {
      background: var(--sidebar-bg);
      padding: 0.2em 0.4em;
      border-radius: 3px;
    }
  </style>
</head>
<body>

  <div id="app">
    <button id="toggle-btn" onclick="toggleSidebar()">Files ☰</button>
    
    <main>
      <div id="loader"></div>
      <div id="content"></div>
    </main>

    <aside id="sidebar">
      <div class="sidebar-section">
        <h3>Upload File</h3>
        <div class="file-input-wrapper">
          <label class="btn" for="file-upload">Choose .md file</label>
          <input type="file" id="file-upload" accept=".md,.markdown,.txt" onchange="handleFileUpload(event)" />
        </div>
      </div>

      <div class="sidebar-section">
        <h3>Fetch URL</h3>
        <input type="text" id="url-input" placeholder="Paste .md URL and press Enter" onkeydown="handleUrlSubmit(event)" />
      </div>

      <div class="sidebar-section" style="flex: 1; overflow: hidden; display: flex; flex-direction: column;">
        <h3>Stored Documents</h3>
        <ul id="file-list"></ul>
      </div>
    </aside>
  </div>

  <script>
    // Marked syntax highlighting configuration
    marked.setOptions({
      highlight: function(code, lang) {
        const language = hljs.getLanguage(lang) ? lang : 'plaintext';
        return hljs.highlight(code, { language }).value;
      },
      langPrefix: 'hljs language-'
    });

    let documents = JSON.parse(localStorage.getItem('md_docs') || '{}');
    let currentDocKey = null;

    window.addEventListener('DOMContentLoaded', () => {
      renderFileList();
      const keys = Object.keys(documents);
      if (keys.length > 0) {
        loadDocument(keys[0]);
      }
    });

    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('open');
    }

    function showLoader() {
      document.getElementById('loader').style.display = 'block';
      document.getElementById('content').style.opacity = '0.3';
    }

    function hideLoader() {
      document.getElementById('loader').style.display = 'none';
      document.getElementById('content').style.opacity = '1';
    }

    function renderMarkdown(text) {
      document.getElementById('content').innerHTML = marked.parse(text);
    }

    function saveToLocalStorage(name, content) {
      documents[name] = content;
      localStorage.setItem('md_docs', JSON.stringify(documents));
      renderFileList();
      loadDocument(name);
    }

    function loadDocument(name) {
      currentDocKey = name;
      const content = documents[name];
      if (content) {
        renderMarkdown(content);
      }
      renderFileList();
    }

    function deleteDocument(e, name) {
      e.stopPropagation();
      delete documents[name];
      localStorage.setItem('md_docs', JSON.stringify(documents));
      
      if (currentDocKey === name) {
        const remainingKeys = Object.keys(documents);
        if (remainingKeys.length > 0) {
          loadDocument(remainingKeys[0]);
        } else {
          currentDocKey = null;
          document.getElementById('content').innerHTML = '';
        }
      }
      renderFileList();
    }

    function renderFileList() {
      const list = document.getElementById('file-list');
      list.innerHTML = '';
      
      Object.keys(documents).forEach(name => {
        const li = document.createElement('li');
        li.className = name === currentDocKey ? 'active' : '';
        li.onclick = () => loadDocument(name);
        
        const textSpan = document.createElement('span');
        textSpan.style.overflow = 'hidden';
        textSpan.style.textOverflow = 'ellipsis';
        textSpan.style.whiteSpace = 'nowrap';
        textSpan.textContent = name;

        const delBtn = document.createElement('span');
        delBtn.className = 'delete-btn';
        delBtn.innerHTML = '&#215;';
        delBtn.onclick = (e) => deleteDocument(e, name);

        li.appendChild(textSpan);
        li.appendChild(delBtn);
        list.appendChild(li);
      });
    }

    function handleFileUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      showLoader();
      
      reader.onload = function(e) {
        hideLoader();
        saveToLocalStorage(file.name, e.target.result);
      };
      
      reader.readAsText(file);
      event.target.value = '';
    }

    async function handleUrlSubmit(event) {
      if (event.key !== 'Enter') return;
      const url = event.target.value.trim();
      if (!url) return;

      showLoader();
      try {
        const response = await fetch(url);
        if (!response.ok) throw new Error('Fetch failed');
        const text = await response.text();
        
        const fileName = url.split('/').pop().split('?')[0] || 'Remote File';
        saveToLocalStorage(fileName, text);
        event.target.value = '';
      } catch (err) {
        alert('Could not fetch URL. Make sure CORS is enabled on the remote server.');
      } finally {
        hideLoader();
      }
    }
  </script>
</body>
</html>
